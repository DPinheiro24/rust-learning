<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Monitor</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>System Monitor</h1>
      <p class="subtitle" id="host-name">Loading...</p>

      <div class="cards">
        <div class="card">
          <div class="card-label">Operating System</div>
          <div class="card-value" id="system-name">—</div>
          <div class="card-sub" id="os-version"></div>
        </div>

        <div class="card">
          <div class="card-label">Total Memory</div>
          <div class="card-value" id="total-memory">—</div>
        </div>

        <div class="card">
          <div class="card-label">Used Memory</div>
          <div class="card-value" id="used-memory">—</div>
          <div class="memory-bar-track">
            <div class="memory-bar-fill" id="memory-bar"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-label">CPU Usage</div>
          <div id="cpu-grid" class="cpu-grid"></div>
        </div>
      </div>
    </main>
  </body>
</html>
